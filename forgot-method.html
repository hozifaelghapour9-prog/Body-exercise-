
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختيار طريقة إعادة تعيين كلمة المرور | BODY EXERCISE</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.78)),
        url("https://raw.githubusercontent.com/hozifaelghapour9-prog/Body-exercise-/main/body-exersice-gym-exact.jpg")
        center/cover no-repeat fixed;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 18px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.3);
    }

    h2 {
      color: #14213d;
      margin: 0 0 12px;
      font-size: 25px;
    }

    .description {
      color: #666;
      line-height: 1.8;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .method {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      text-align: right;
      transition: .2s;
    }

    .method:hover {
      border-color: #2563eb;
      background: #f5f8ff;
    }

    .method:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .method-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef3ff;
      font-size: 23px;
      flex-shrink: 0;
    }

    .method-content {
      flex: 1;
    }

    .method-content strong {
      display: block;
      color: #14213d;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .method-content small {
      color: #777;
      font-size: 12px;
      direction: ltr;
      display: block;
      text-align: right;
      overflow-wrap: anywhere;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>اختار طريقة التحقق</h2>

    <p class="description">
      اختار الطريقة المناسبة لإرسال رمز التحقق وإعادة تعيين كلمة المرور.
    </p>

    <button class="method" id="emailMethod" type="button">
      <span class="method-icon">✉️</span>
      <span class="method-content">
        <strong>الإيميل</strong>
        <small id="emailDisplay">إرسال رمز التحقق إلى بريدك الإلكتروني</small>
      </span>
    </button>

    <button class="method" id="phoneMethod" type="button" disabled>
      <span class="method-icon">📱</span>
      <span class="method-content">
        <strong>رقم الهاتف</strong>
        <small>غير متاح حاليًا</small>
      </span>
    </button>

    <p id="message"></p>

    <a class="back" href="forgot-password.html">رجوع</a>
  </main>

  <script>
    const SUPABASE_URL = "https://xgxmtizyzjfxxwsmcspe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Jl3bsVErQ87xlzyNkJrRNw_aD_TKsEg";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const phoneEmail = sessionStorage.getItem("reset_phone_email");
    const message = document.getElementById("message");
    const emailMethod = document.getElementById("emailMethod");

    if (!phoneEmail) {
      message.style.color = "#dc2626";
      message.textContent = "بيانات الحساب غير موجودة. ارجع واكتب الإيميل مرة أخرى.";
      emailMethod.disabled = true;
    } else {
      document.getElementById("emailDisplay").textContent = phoneEmail;
    }

    emailMethod.addEventListener("click", async () => {
      if (!phoneEmail) return;

      emailMethod.disabled = true;
      message.style.color = "#555";
      message.textContent = "جاري إرسال رمز التحقق إلى بريدك الإلكتروني...";

      try {
        const { error } = await db.auth.signInWithOtp({
          email: phoneEmail,
          options: {
            shouldCreateUser: false
          }
        });

        if (error) throw error;

        sessionStorage.setItem("reset_method", "email");
        sessionStorage.setItem("reset_email", phoneEmail);
        sessionStorage.removeItem("reset_verified");

        window.location.href = "reset-otp.html";

      } catch (error) {
        message.style.color = "#dc2626";
        message.textContent = error.message || "حدث خطأ أثناء إرسال رمز التحقق.";
        emailMethod.disabled = false;
      }
    });

    document.getElementById("phoneMethod").addEventListener("click", () => {
      message.style.color = "#dc2626";
      message.textContent = "التحقق عن طريق الهاتف غير متاح حاليًا.";
    });
  </script>
</body>
</html>
