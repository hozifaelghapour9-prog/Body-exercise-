
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">
  <title>BODY RESET | تسجيل الدخول</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    .auth-wrap {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(85,199,194,.15), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(85,199,194,.12), transparent 35%);
    }

    .auth-card {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 40px 20px;

      background: rgba(255,255,255,.09);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border: 1px solid rgba(255,255,255,.18);
      border-radius: 0;
      box-shadow: none;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .auth-card > * {
      width: min(430px, 100%);
    }

    .auth-card .brand {
      margin-bottom: 26px;
    }

    .auth-card h1 {
      font-size: 23px;
      margin-bottom: 6px;
    }

    .auth-sub {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 22px;
      line-height: 1.8;
    }

    .auth-form {
      display: grid;
      gap: 14px;
    }

    .auth-form label {
      display: block;
      font-size: 13px;
    }

    .auth-form .field {
      width: 100%;
      margin-top: 7px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.17);
      color: var(--text);
      border-radius: 11px;
      min-height: 45px;
    }

    .auth-form .field:focus {
      outline: none;
      border-color: var(--lime);
      box-shadow: 0 0 0 3px rgba(85,199,194,.13);
    }

    .auth-form select.field {
      cursor: pointer;
    }

    .auth-form select.field option {
      background: var(--panel);
      color: var(--text);
    }

    .auth-form .btn {
      margin-top: 8px;
    }

    .auth-switch {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .auth-switch button,
    .auth-forgot {
      border: 0;
      background: none;
      color: var(--lime);
      font: inherit;
      cursor: pointer;
    }

    .auth-forgot {
      font-size: 12px;
      text-align: left;
      margin-top: -5px;
    }

    .google-btn {
      width: 100%;
      min-height: 46px;
      margin-top: 14px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: .2s;
    }

    .google-btn:hover {
      background: rgba(255,255,255,.12);
    }

    .google-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 11px;
      margin-top: 16px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    #authMessage {
      min-height: 22px;
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    .auth-card label.hidden {
      display: none !important;
    }

    .auth-card .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 25px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="auth-wrap">
    <section class="auth-card">

      <a class="brand" href="login.html">
        <span class="brand-mark">B</span>
        <span>
          <strong>BODY RESET</strong>
          <small>EXERCISE PLATFORM</small>
        </span>
      </a>

      <h1 id="authTitle">تسجيل الدخول</h1>

      <p class="auth-sub" id="authSubtitle">
        سجّل دخولك للوصول إلى التمارين والبرامج.
      </p>

      <form class="auth-form" id="authForm">

        <label id="nameLabel" class="hidden">
          الاسم الكامل
          <input
            class="field"
            id="fullName"
            type="text"
            autocomplete="name"
            placeholder="اكتب اسمك الكامل"
          >
        </label>

        <label id="genderLabel" class="hidden">
          النوع
          <select class="field" id="gender">
            <option value="">اختر النوع</option>
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
          </select>
        </label>

        <label>
          البريد الإلكتروني
          <input
            class="field"
            id="email"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            required
          >
        </label>

        <label id="passwordLabel">
          <span id="passwordTitle">كلمة المرور</span>
          <input
            class="field"
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="كلمة المرور"
            minlength="6"
            required
          >
        </label>

        <label id="confirmLabel" class="hidden">
          تأكيد كلمة المرور
          <input
            class="field"
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="أعد كتابة كلمة المرور"
            minlength="6"
          >
        </label>

        <button
          class="auth-forgot"
          id="forgotPassword"
          type="button"
        >
          نسيت كلمة المرور؟
        </button>

        <button
          class="btn btn-primary btn-full"
          id="submitBtn"
          type="submit"
        >
          دخول
        </button>

      </form>

      <div id="googleSection">
        <div class="auth-divider">أو</div>

        <button class="google-btn" id="googleBtn" type="button">
          🌐 المتابعة باستخدام Google
        </button>
      </div>

      <p id="authMessage" role="status" aria-live="polite"></p>

      <p class="auth-switch" id="switchSection">
        <span id="switchText">ليس لديك حساب؟</span>
        <button id="switchMode" type="button">
          إنشاء حساب
        </button>
      </p>

      <a class="back-link" href="index.html">
        العودة للموقع
      </a>

    </section>
  </main>

  <script>
  (() => {

    const SUPABASE_URL =
      "https://xgxmtizyzjfxxwsmcspe.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Jl3bsVErQ87xlzyNkJrRNw_aD_TKsEg";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = id => document.getElementById(id);

    let mode = "login";
    let isRedirecting = false;

    const isRecoveryPage =
      new URLSearchParams(location.search).get("reset") === "1";

    function showMessage(text, error = false) {
      $("authMessage").textContent = text;
      $("authMessage").style.color =
        error ? "var(--danger)" : "var(--lime)";
    }

    function setMode(newMode) {
      mode = newMode;

      const signup = mode === "signup";
      const reset = mode === "reset";
      const forgot = mode === "forgot";

      $("authTitle").textContent =
        signup ? "إنشاء حساب جديد" :
        reset ? "تعيين كلمة مرور جديدة" :
        forgot ? "استعادة الحساب" :
        "تسجيل الدخول";

      $("authSubtitle").textContent =
        signup ? "أنشئ حسابك للوصول إلى BODY RESET." :
        reset ? "اكتب كلمة المرور الجديدة لحسابك." :
        forgot ? "اكتب بريدك الإلكتروني وسنرسل لك رابط استعادة الحساب." :
        "سجّل دخولك للوصول إلى التمارين والبرامج.";

      $("nameLabel").classList.toggle("hidden", !signup);
      $("fullName").required = signup;

      $("genderLabel").classList.toggle("hidden", !signup);
      $("gender").required = signup;

      $("passwordLabel").classList.toggle("hidden", forgot);
      $("password").required = !forgot;

      $("confirmLabel").classList.toggle(
        "hidden",
        !(signup || reset)
      );

      $("confirmPassword").required = signup || reset;

      $("passwordTitle").textContent =
        reset ? "كلمة المرور الجديدة" : "كلمة المرور";

      $("password").autocomplete =
        signup || reset ? "new-password" : "current-password";

      $("forgotPassword").classList.toggle(
        "hidden",
        mode !== "login"
      );

      $("googleSection").classList.toggle(
        "hidden",
        mode !== "login"
      );

      $("switchSection").classList.toggle(
        "hidden",
        reset || forgot
      );

      $("submitBtn").textContent =
        signup ? "إنشاء الحساب" :
        reset ? "حفظ كلمة المرور الجديدة" :
        forgot ? "إرسال رابط الاستعادة" :
        "دخول";

      $("switchText").textContent =
        signup ? "لديك حساب بالفعل؟" : "ليس لديك حساب؟";

      $("switchMode").textContent =
        signup ? "تسجيل الدخول" : "إنشاء حساب";

      showMessage("");
    }

    function redirectToHome() {
      if (isRedirecting) return;

      isRedirecting = true;
      location.replace("index.html");
    }

    // التبديل بين الدخول وإنشاء الحساب
    $("switchMode").addEventListener("click", () => {
      setMode(mode === "signup" ? "login" : "signup");
    });

    // تسجيل الدخول باستخدام Google
    $("googleBtn").addEventListener("click", async () => {

      const button = $("googleBtn");

      button.disabled = true;
      showMessage("جارٍ الاتصال بحساب Google...");

      try {

        const { error } = await db.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: location.origin + location.pathname
          }
        });

        if (error) throw error;

      } catch (error) {

        showMessage(
          error.message || "تعذر تسجيل الدخول باستخدام Google.",
          true
        );

        button.disabled = false;
      }
    });

    // استعادة كلمة المرور
    $("forgotPassword").addEventListener("click", async () => {

      const email = $("email").value.trim();

      if (!email) {
        showMessage("اكتب بريدك الإلكتروني أولاً.", true);
        $("email").focus();
        return;
      }

      const button = $("forgotPassword");

      button.disabled = true;
      showMessage("جارٍ إرسال رابط الاستعادة...");

      try {

        const { error } = await db.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              location.origin +
              location.pathname +
              "?reset=1"
          }
        );

        if (error) throw error;

        showMessage(
          "لو البريد مسجل عندنا، هتوصلك رسالة فيها رابط استعادة كلمة المرور. راجع صندوق الوارد والرسائل غير المرغوب فيها."
        );

      } catch (error) {

        showMessage(
          error.message || "تعذر إرسال رابط الاستعادة.",
          true
        );

      } finally {

        button.disabled = false;
      }
    });

    // إنشاء حساب / تسجيل دخول / تغيير كلمة المرور
    $("authForm").addEventListener("submit", async event => {

      event.preventDefault();

      const email = $("email").value.trim();
      const password = $("password").value;
      const confirmPassword = $("confirmPassword").value;
      const button = $("submitBtn");

      if (mode === "signup") {

        if (!$("fullName").value.trim()) {
          showMessage("اكتب اسمك الكامل.", true);
          $("fullName").focus();
          return;
        }

        if (!$("gender").value) {
          showMessage("اختر النوع.", true);
          $("gender").focus();
          return;
        }
      }

      if (mode === "signup" || mode === "reset") {

        if (password !== confirmPassword) {
          showMessage("كلمتا المرور غير متطابقتين.", true);
          $("confirmPassword").focus();
          return;
        }
      }

      button.disabled = true;
      showMessage("جارٍ تنفيذ الطلب...");

      try {

        // إنشاء حساب جديد
        if (mode === "signup") {

          const { data, error } = await db.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: $("fullName").value.trim(),
                gender: $("gender").value
              }
            }
          });

          if (error) throw error;

          if (data.session) {

            showMessage("تم إنشاء الحساب بنجاح.");

            setTimeout(() => {
              redirectToHome();
            }, 700);

          } else {

            showMessage(
              "تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب، ثم سجّل الدخول."
            );

          }
        }

        // تسجيل الدخول
        else if (mode === "login") {

          const { error } = await db.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          redirectToHome();
        }

        // إرسال رابط استعادة كلمة المرور
        else if (mode === "forgot") {

          const { error } = await db.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                location.origin +
                location.pathname +
                "?reset=1"
            }
          );

          if (error) throw error;

          showMessage(
            "لو البريد مسجل عندنا، هتوصلك رسالة فيها رابط استعادة كلمة المرور."
          );
        }

        // حفظ كلمة المرور الجديدة
        else if (mode === "reset") {

          const { error } = await db.auth.updateUser({
            password: password
          });

          if (error) throw error;

          showMessage(
            "تم تغيير كلمة المرور بنجاح. تقدر تدخل إلى حسابك الآن."
          );

          $("password").value = "";
          $("confirmPassword").value = "";

          setTimeout(() => {
            redirectToHome();
          }, 1500);
        }

      } catch (error) {

        showMessage(
          error.message || "تعذر إكمال الطلب.",
          true
        );

      } finally {

        button.disabled = false;
      }
    });

    // استقبال رابط استعادة كلمة المرور أو تسجيل الدخول من Google
    db.auth.onAuthStateChange((event, session) => {

      if (event === "PASSWORD_RECOVERY") {
        setMode("reset");
        return;
      }

      if (
        event === "SIGNED_IN" &&
        !isRecoveryPage &&
        session
      ) {
        redirectToHome();
      }
    });

    // التحقق من الجلسة عند فتح الصفحة
    db.auth.getSession().then(({ data, error }) => {

      if (error || !data.session) return;

      if (isRecoveryPage) {
        setMode("reset");
      } else {
        redirectToHome();
      }
    });

    setMode(isRecoveryPage ? "reset" : "login");

  })();
  </script>

</body>
</html>
