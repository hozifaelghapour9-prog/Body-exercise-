<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">
  <title>BODY EXERCISE | تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; min-height:100%; margin:0; }
    body { background:#0b0e13; }

    .auth-card a.brand,
    .auth-card a.brand:hover,
    .auth-card a.brand:focus {
      display:block !important;
      width:100% !important;
      margin:0 0 26px !important;
      padding:0 !important;
      background:none !important;
      border:0 !important;
      box-shadow:none !important;
      text-decoration:none !important;
      text-align:right !important;
    }

    .auth-card .brand .brand-mark {
      display:none !important;
    }

    .auth-card .brand strong {
      display:block !important;
      font-size:23px !important;
      font-weight:800 !important;
      line-height:1.4;
      letter-spacing:0;
      background:none !important;
      border:0 !important;
      box-shadow:none !important;
    }

    .auth-card .brand small {
      display:block !important;
      color:#c1c9d1 !important;
      font-size:10px !important;
      font-weight:400 !important;
      text-align:right !important;
      margin-top:2px !important;
      background:none !important;
      border:0 !important;
    }

    .auth-wrap {
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      background-image:url("https://raw.githubusercontent.com/hozifaelghapour9-prog/Body-exercise-/main/body-exersice-gym-exact.jpg");
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }

    .auth-card {
      width:100%;
      min-height:100vh;
      min-height:100dvh;
      padding:35px 20px;
      background:rgba(11,14,19,.78);
      backdrop-filter:blur(3px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    .auth-card > * { width:min(430px,100%); }
    .auth-card h1 { font-size:23px; margin-bottom:6px; }

    .auth-sub {
      color:#c1c9d1;
      font-size:13px;
      margin-bottom:22px;
      line-height:1.9;
      font-weight:500;
    }

    .auth-form { display:grid; gap:14px; }

    .auth-form label {
      display:block;
      font-size:13px;
      color:#f4f6f8;
    }

    .input-wrap {
      position:relative;
      width:100%;
      margin-top:7px;
    }

    .field {
      width:100%;
      min-height:45px;
      padding:0 14px;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.22);
      color:#fff;
      border-radius:11px;
      font:inherit;
      direction:rtl;
    }

    .field::placeholder { color:#aab4c0; }

    .field:focus {
      outline:none;
      border-color:#55c7c2;
      box-shadow:0 0 0 3px rgba(85,199,194,.13);
    }

    /* قائمة النوع */
    .gender-control {
      position:relative;
      width:100%;
      margin-top:7px;
    }

    .gender-trigger {
      width:100%;
      height:45px;
      padding:0 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      direction:rtl;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.22);
      border-radius:11px;
      color:#aab4c0;
      font:inherit;
      text-align:right;
      cursor:pointer;
      transition:border-color .2s, box-shadow .2s;
    }

    .gender-trigger.selected { color:#fff; }

    .gender-trigger:focus,
    .gender-control.open .gender-trigger {
      outline:none;
      border-color:#55c7c2;
      box-shadow:0 0 0 3px rgba(85,199,194,.13);
    }

    .gender-arrow {
      width:10px;
      height:10px;
      border-left:2px solid #55c7c2;
      border-bottom:2px solid #55c7c2;
      transform:rotate(-45deg);
      transition:transform .2s;
      margin-left:5px;
      flex-shrink:0;
    }

    .gender-control.open .gender-arrow {
      transform:rotate(135deg);
    }

    .gender-menu {
      display:none;
      position:absolute;
      top:calc(100% + 7px);
      right:0;
      left:0;
      z-index:50;
      padding:7px;
      background:rgba(25,32,39,.98);
      border:1px solid rgba(85,199,194,.5);
      border-radius:13px;
      box-shadow:0 12px 30px rgba(0,0,0,.45);
      backdrop-filter:blur(15px);
    }

    .gender-control.open .gender-menu {
      display:block;
      animation:genderAppear .18s ease-out;
    }

    @keyframes genderAppear {
      from { opacity:0; transform:translateY(-6px); }
      to { opacity:1; transform:translateY(0); }
    }

    .gender-option {
      width:100%;
      min-height:49px;
      padding:0 13px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      background:transparent;
      border:0;
      border-radius:8px;
      color:#f4f6f8;
      font:inherit;
      text-align:right;
      cursor:pointer;
      transition:background .2s, color .2s;
    }

    .gender-option + .gender-option {
      border-top:1px solid rgba(255,255,255,.09);
    }

    .gender-option:hover,
    .gender-option:focus {
      outline:none;
      background:rgba(85,199,194,.12);
      color:#55c7c2;
    }

    .gender-option.active {
      color:#55c7c2;
      background:rgba(85,199,194,.08);
    }

    .auth-form .btn { margin-top:8px; }

    .auth-switch {
      margin-top:18px;
      color:#c1c9d1;
      font-size:12px;
      text-align:center;
    }

    .auth-switch button, .auth-forgot {
      border:0;
      background:none;
      color:#55c7c2;
      font:inherit;
      cursor:pointer;
    }

    .auth-forgot {
      font-size:12px;
      text-align:left;
    }

    .google-btn {
      width:100%;
      min-height:46px;
      margin-top:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      border:1px solid rgba(255,255,255,.2);
      border-radius:10px;
      background:rgba(255,255,255,.08);
      color:#fff;
      font:inherit;
      cursor:pointer;
    }

    .google-logo { width:21px; height:21px; }

    .auth-divider {
      display:flex;
      align-items:center;
      gap:12px;
      color:#c1c9d1;
      font-size:11px;
      margin-top:16px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content:"";
      flex:1;
      height:1px;
      background:rgba(255,255,255,.2);
    }

    #authMessage {
      min-height:22px;
      margin-top:14px;
      font-size:12px;
      line-height:1.7;
    }

    .hidden { display:none !important; }

    @media(max-width:600px) {
      .auth-wrap { background-attachment:scroll; }
      .auth-card { padding:25px 18px; }
    }
  </style>
</head>

<body>
<main class="auth-wrap">
<section class="auth-card">

  <a class="brand" href="login.html">
    <strong>
      <span style="color:#ffffff;">Body</span>
      <span style="color:#55c7c2;">exercise</span>
    </strong>
    <small>EXERCISE PLATFORM</small>
  </a>

  <h1 id="authTitle">تسجيل الدخول</h1>

  <p class="auth-sub" id="authSubtitle">
    سجّل دخولك باستخدام اسم المستخدم وكلمة المرور.
  </p>

  <form class="auth-form" id="authForm">

    <label id="fullNameLabel" class="hidden">
      الاسم الكامل
      <input class="field" id="fullName" type="text"
        autocomplete="name" placeholder="اكتب اسمك الكامل">
    </label>

    <label id="usernameLabel">
      اسم المستخدم
      <input class="field" id="username" type="text"
        autocomplete="username" autocapitalize="none"
        spellcheck="false" placeholder="اسم المستخدم"
        minlength="3" maxlength="20">
    </label>

    <label id="emailLabel" class="hidden">
      البريد الإلكتروني
      <input class="field" id="email" type="email"
        autocomplete="email" dir="ltr">
    </label>

    <label id="genderLabel" class="hidden">
      النوع

      <div class="gender-control" id="genderControl">
        <button
          class="gender-trigger"
          id="genderTrigger"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="genderMenu">

          <span id="genderText">اختر النوع</span>
          <span class="gender-arrow"></span>
        </button>

        <div class="gender-menu" id="genderMenu"
          role="listbox" aria-label="اختر النوع">

          <button class="gender-option" type="button"
            role="option" data-value="male"
            aria-selected="false">ذكر</button>

          <button class="gender-option" type="button"
            role="option" data-value="female"
            aria-selected="false">أنثى</button>
        </div>
      </div>

      <input type="hidden" id="gender" value="">
    </label>

    <label>
      <span>كلمة المرور</span>
      <div class="input-wrap">
        <input class="field" id="password" type="password"
          autocomplete="current-password"
          placeholder="كلمة المرور" minlength="6" required>
      </div>
    </label>

    <label id="confirmLabel" class="hidden">
      تأكيد كلمة المرور
      <div class="input-wrap">
        <input class="field" id="confirmPassword" type="password"
          autocomplete="new-password"
          placeholder="أعد كتابة كلمة المرور" minlength="6">
      </div>
    </label>

    <button class="auth-forgot" id="forgotPassword" type="button">
      نسيت كلمة المرور؟
    </button>

    <button class="btn btn-primary btn-full" id="submitBtn" type="submit">
      دخول
    </button>

  </form>

  <div id="googleSection">
    <div class="auth-divider">أو</div>

    <button class="google-btn" id="googleBtn" type="button">
      <svg class="google-logo" viewBox="0 0 48 48"
        xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/>
        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/>
        <path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/>
        <path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.9 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/>
      </svg>
      <span>المتابعة باستخدام Google</span>
    </button>
  </div>

  <p id="authMessage" role="status" aria-live="polite"></p>

  <p class="auth-switch" id="switchSection">
    <span id="switchText">ليس لديك حساب؟</span>
    <button id="switchMode" type="button">إنشاء حساب</button>
  </p>

</section>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://xgxmtizyzjfxxwsmcspe.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Jl3bsVErQ87xlzyNkJrRNw_aD_TKsEg";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = id => document.getElementById(id);

  let mode = "login";
  let busy = false;

  const GOOGLE_PENDING_KEY = "bodyResetGoogleOAuthPending";

  function message(text, error = false) {
    $("authMessage").textContent = text;
    $("authMessage").style.color =
      error ? "#ff7777" : "#55c7c2";
  }

  function redirectHome() {
    sessionStorage.setItem("bodyResetManualEntry", "1");
    location.replace("index.html");
  }

  function toggleGenderMenu(force) {
    const control = $("genderControl");
    const trigger = $("genderTrigger");

    const shouldOpen =
      typeof force === "boolean"
        ? force
        : !control.classList.contains("open");

    control.classList.toggle("open", shouldOpen);
    trigger.setAttribute("aria-expanded", String(shouldOpen));
  }

  function selectGender(value) {
    const options = document.querySelectorAll(".gender-option");
    const selected = value === "male" ? "ذكر" : "أنثى";

    $("gender").value = value;
    $("genderText").textContent = selected;
    $("genderTrigger").classList.add("selected");

    options.forEach(option => {
      const active = option.dataset.value === value;
      option.classList.toggle("active", active);
      option.setAttribute("aria-selected", String(active));
    });

    toggleGenderMenu(false);
  }

  $("genderTrigger").addEventListener("click", () => {
    toggleGenderMenu();
  });

  document.querySelectorAll(".gender-option").forEach(option => {
    option.addEventListener("click", () => {
      selectGender(option.dataset.value);
    });
  });

  document.addEventListener("click", event => {
    if (!$("genderControl").contains(event.target)) {
      toggleGenderMenu(false);
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      toggleGenderMenu(false);
    }
  });

  function setMode(next) {
    mode = next;
    const signup = mode === "signup";

    $("authTitle").textContent =
      signup ? "إنشاء حساب جديد" : "تسجيل الدخول";

    $("authSubtitle").textContent =
      signup
        ? "أدخل بياناتك لإنشاء حسابك في BODY EXERCISE."
        : "سجّل دخولك باستخدام اسم المستخدم وكلمة المرور.";

    $("fullNameLabel").classList.toggle("hidden", !signup);
    $("usernameLabel").classList.remove("hidden");
    $("emailLabel").classList.toggle("hidden", !signup);
    $("genderLabel").classList.toggle("hidden", !signup);
    $("confirmLabel").classList.toggle("hidden", !signup);

    $("fullName").required = signup;
    $("username").required = true;
    $("email").required = signup;
    $("confirmPassword").required = signup;

    $("password").autocomplete =
      signup ? "new-password" : "current-password";

    $("forgotPassword").classList.toggle("hidden", signup);
    $("googleSection").classList.toggle("hidden", signup);

    $("submitBtn").textContent =
      signup ? "إنشاء الحساب" : "دخول";

    $("switchText").textContent =
      signup ? "لديك حساب بالفعل؟" : "ليس لديك حساب؟";

    $("switchMode").textContent =
      signup ? "تسجيل الدخول" : "إنشاء حساب";

    toggleGenderMenu(false);
    message("");
  }

  $("switchMode").addEventListener("click", () => {
    setMode(mode === "login" ? "signup" : "login");
  });

  $("authForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;

    const email = $("email").value.trim().toLowerCase();
    const password = $("password").value;
    const username = $("username").value.trim().toLowerCase();
    const signup = mode === "signup";

    if (password.length < 6) {
      message("كلمة المرور يجب ألا تقل عن 6 أحرف.", true);
      return;
    }

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
      message("اسم المستخدم من 3 إلى 20 حرفًا أو رقمًا أو _.", true);
      return;
    }

    if (signup) {
      if (!email) {
        message("اكتب البريد الإلكتروني.", true);
        return;
      }

      if (!$("fullName").value.trim() || !$("gender").value) {
        message("أدخل الاسم الكامل واختر النوع.", true);
        return;
      }

      if (password !== $("confirmPassword").value) {
        message("كلمتا المرور غير متطابقتين.", true);
        return;
      }
    }

    busy = true;
    $("submitBtn").disabled = true;

    message(signup ? "جارٍ إنشاء الحساب..." : "جارٍ تسجيل الدخول...");

    try {
      if (signup) {
        const { data, error } = await db.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: $("fullName").value.trim(),
              username,
              gender: $("gender").value
            }
          }
        });

        if (error) throw error;
        if (!data.user) throw new Error("تعذر إنشاء الحساب.");

        const { error: profileError } = await db
          .from("user_profiles")
          .insert({
            id: data.user.id,
            username,
            gender: $("gender").value
          });

        if (profileError) {
          throw new Error(
            profileError.code === "23505"
              ? "اسم المستخدم مستخدم بالفعل. اختر اسمًا آخر."
              : "تعذر حفظ بيانات الملف الشخصي: " + profileError.message
          );
        }

        if (data.session) {
          message("تم إنشاء الحساب بنجاح.");
          setTimeout(redirectHome, 700);
        } else {
          message("تم إنشاء الحساب. يمكنك تسجيل الدخول الآن.");
          setMode("login");
          $("username").value = username;
          $("password").value = "";
        }

      } else {
        const { data: emailData, error: lookupError } =
          await db.rpc("get_email_by_username", {
            p_username: username
          });

        if (lookupError) {
          throw new Error("تعذر البحث عن اسم المستخدم: " + lookupError.message);
        }

        if (!emailData) {
          throw new Error("اسم المستخدم غير موجود.");
        }

        const { data, error } = await db.auth.signInWithPassword({
          email: emailData,
          password
        });

        if (error) throw error;
        if (!data.session) throw new Error("تعذر تسجيل الدخول.");

        message("تم تسجيل الدخول بنجاح.");
        setTimeout(redirectHome, 500);
      }

    } catch (error) {
      message(error.message || "حدث خطأ أثناء تنفيذ الطلب.", true);
    } finally {
      busy = false;
      $("submitBtn").disabled = false;
    }
  });

  $("googleBtn").addEventListener("click", async () => {
    message("جارٍ الاتصال بحساب Google...");
    sessionStorage.setItem(GOOGLE_PENDING_KEY, "1");

    const { error } = await db.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: location.origin + location.pathname
      }
    });

    if (error) {
      sessionStorage.removeItem(GOOGLE_PENDING_KEY);
      message(error.message, true);
    }
  });

  $("forgotPassword").addEventListener("click", async () => {
    const email = prompt("اكتب البريد الإلكتروني المرتبط بحسابك:");

    if (!email || !email.trim()) return;

    const { error } = await db.auth.resetPasswordForEmail(
      email.trim().toLowerCase(),
      {
        redirectTo: location.origin + location.pathname
      }
    );

    if (error) {
      message(error.message, true);
    } else {
      message("تم إرسال رابط استعادة كلمة المرور إلى بريدك.");
    }
  });

  db.auth.onAuthStateChange((event, session) => {
    if (
      event === "SIGNED_IN" &&
      session &&
      sessionStorage.getItem(GOOGLE_PENDING_KEY) === "1"
    ) {
      sessionStorage.removeItem(GOOGLE_PENDING_KEY);
      redirectHome();
    }
  });

  setMode("login");
})();
</script>
</body>
</html>
