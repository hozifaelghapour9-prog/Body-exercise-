
<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">

  <title>BODY RESET | WORKOUT</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #0b0e13;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .workout-main {
      width: 100%;
      padding: 15px;
      padding-bottom: 100px;
      box-sizing: border-box;
    }

    .workout-hero {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #151c25;
      border: 1px solid #30363e;
    }

    .workout-hero img {
      display: block;
      width: 100%;
      height: 250px;
      object-fit: cover;
      object-position: center;
    }

    .workout-intro {
      padding: 25px 16px 28px;
      text-align: center;
    }

    .workout-intro p {
      margin: 0;
      color: #ffffff;
      font-size: clamp(22px, 5.5vw, 30px);
      font-weight: 900;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }

    @media (max-width: 480px) {
      .workout-hero img {
        height: 220px;
      }

      .workout-intro {
        padding: 22px 12px;
      }
    }
  </style>
</head>

<body data-page="public">

  <main class="workout-main">

    <!-- Workout Hero Image -->
    <section class="workout-hero">

      <img
        src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=85"
        alt="Dark professional gym interior"
      >

      <div class="workout-intro">
        <p>
          Your only competition is who you were yesterday.
        </p>
      </div>

    </section>

    <!-- Workout content will be added here later -->

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">

    <button class="bottom-nav-item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
      </svg>
      <span>Profile</span>
    </button>

    <button class="bottom-nav-item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 21h18"></path>
        <rect x="5" y="12" width="3" height="9" rx="1"></rect>
        <rect x="11" y="7" width="3" height="14" rx="1"></rect>
        <rect x="17" y="3" width="3" height="18" rx="1"></rect>
      </svg>
      <span>Progress</span>
    </button>

    <a class="bottom-nav-item active" href="workout.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6"></path>
        <path d="M6 7v10"></path>
        <path d="M18 7v10"></path>
        <path d="M21 9v6"></path>
        <path d="M6 12h12"></path>
      </svg>
      <span>Workouts</span>
    </a>

    <a class="bottom-nav-item" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 10 9-7 9 7"></path>
        <path d="M5 9v12h14V9"></path>
        <path d="M9 21v-7h6v7"></path>
      </svg>
      <span>Home</span>
    </a>

  </nav>

</body>
</html>
