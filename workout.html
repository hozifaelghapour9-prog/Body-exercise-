
<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">

  <title>BODY exercise | WORKOUT</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #0b0e13;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .workout-main {
      width: 100%;
      padding: 15px;
      padding-bottom: 100px;
      box-sizing: border-box;
    }

    .workout-hero {
      position: relative;
      width: 100%;
      height: 250px;
      overflow: hidden;
      border-radius: 18px;
      background: #151c25;
      border: 1px solid #30363e;
    }

    .workout-hero img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .workout-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }

    .workout-intro {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      transform: translateY(18px);
    }

    .workout-intro p {
      margin: 0;
      color: #ffffff;
      font-size: clamp(22px, 5.5vw, 30px);
      font-weight: 900;
      line-height: 1.5;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    /* Exercises Entry */
    .exercises-entry {
      margin-top: 22px;
      width: 100%;
    }

    .exercises-entry button {
      width: 100%;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #151c25;
      border: 1px solid #30363e;
      border-radius: 15px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .exercises-entry button svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: #b7e0d2;
      stroke-width: 2;
      transition: transform 0.2s ease;
    }

    /* Exercises Section */
    .exercises-section {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #151c25;
      border: 1px solid #30363e;
      border-radius: 18px;
    }

    .exercises-section.active {
      display: block;
    }

    .exercises-section h2 {
      margin: 0 0 20px;
      color: #b7e0d2;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      .workout-hero {
        height: 220px;
      }
    }
  </style>
</head>

<body data-page="public">

  <main class="workout-main">

    <!-- Workout Hero -->
    <section class="workout-hero">

      <img
        src="body-exersice-gym-exact.jpg"
        alt="Dark professional gym interior"
      >

      <div class="workout-intro">
        <p>
          Your only competition is<br>
          who you were yesterday
        </p>
      </div>

    </section>

    <!-- Exercises Entry -->
    <div class="exercises-entry">
      <button
        type="button"
        id="exercisesToggle"
        aria-expanded="false"
        aria-controls="exercisesSection"
      >
        <span>EXERCISES</span>

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
    </div>

    <!-- Exercises Section -->
    <section
      class="exercises-section"
      id="exercisesSection"
      aria-label="Exercises"
    >
      <h2>EXERCISES</h2>

      <!-- Exercise content will be added here later -->

    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">

    <button class="bottom-nav-item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
      </svg>
      <span>Profile</span>
    </button>

    <button class="bottom-nav-item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 21h18"></path>
        <rect x="5" y="12" width="3" height="9" rx="1"></rect>
        <rect x="11" y="7" width="3" height="14" rx="1"></rect>
        <rect x="17" y="3" width="3" height="18" rx="1"></rect>
      </svg>
      <span>Progress</span>
    </button>

    <a class="bottom-nav-item active" href="workout.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6"></path>
        <path d="M6 7v10"></path>
        <path d="M18 7v10"></path>
        <path d="M21 9v6"></path>
        <path d="M6 12h12"></path>
      </svg>
      <span>Workouts</span>
    </a>

    <a class="bottom-nav-item" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 10 9-7 9 7"></path>
        <path d="M5 9v12h14V9"></path>
        <path d="M9 21v-7h6v7"></path>
      </svg>
      <span>Home</span>
    </a>

  </nav>

  <script>
    const exercisesToggle = document.getElementById("exercisesToggle");
    const exercisesSection = document.getElementById("exercisesSection");

    exercisesToggle.addEventListener("click", function () {
      const isOpen = exercisesSection.classList.toggle("active");

      exercisesToggle.setAttribute("aria-expanded", isOpen);

      if (isOpen) {
        exercisesSection.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    });
  </script>

</body>
</html>
