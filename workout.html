
<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">

  <title>BODY RESET | WORKOUT</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #0b0e13;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .workout-main {
      width: 100%;
      padding: 15px;
      padding-bottom: 100px;
      box-sizing: border-box;
    }

    .workout-hero {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #151c25;
      border: 1px solid #30363e;
    }

    .workout-hero img {
      display: block;
      width: 100%;
      height: 250px;
      object-fit: cover;
      object-position: center;
    }

    .workout-intro {
      padding: 25px 16px 28px;
      text-align: center;
    }

    .workout-intro p {
      margin: 0;
      color: #ffffff;
      font-size: clamp(22px, 5.5vw, 30px);
      font-weight: 900;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }

    /* MUSCLE ANATOMY SECTION */

    .muscle-anatomy {
      margin-top: 25px;
      padding: 18px;
      background: #151c25;
      border: 1px solid #30363e;
      border-radius: 18px;
    }

    .muscle-anatomy h2 {
      margin: 0 0 18px;
      color: #b7e0d2;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 1px;
      text-align: center;
    }

    .muscle-search {
      width: 100%;
      height: 48px;
      padding: 0 15px;
      margin-bottom: 20px;
      box-sizing: border-box;
      border: 1px solid #414b57;
      border-radius: 12px;
      outline: none;
      background: #0b0e13;
      color: #ffffff;
      font-size: 15px;
    }

    .muscle-search::placeholder {
      color: #89939e;
    }

    .muscle-search:focus {
      border-color: #b7e0d2;
    }

    .muscle-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .muscle-card {
      min-width: 0;
      overflow: hidden;
      background: #0b0e13;
      border: 1px solid #30363e;
      border-radius: 13px;
      text-align: center;
    }

    .muscle-card img {
      display: block;
      width: 100%;
      height: 145px;
      object-fit: contain;
      background: #ffffff;
    }

    .muscle-card h3 {
      margin: 0;
      padding: 13px 5px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
    }

    .no-results {
      display: none;
      padding: 20px 5px;
      color: #c5cbd1;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .workout-hero img {
        height: 220px;
      }

      .workout-intro {
        padding: 22px 12px;
      }

      .muscle-anatomy {
        padding: 14px;
      }

      .muscle-card img {
        height: 125px;
      }
    }
  </style>
</head>

<body data-page="public">

  <main class="workout-main">

    <!-- Workout Hero Image -->
    <section class="workout-hero">

      <img
        src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=85"
        alt="Dark professional gym interior"
      >

      <div class="workout-intro">
        <p>
          Your only competition is<br>
          who you were yesterday
        </p>
      </div>

    </section>

    <!-- MUSCLE ANATOMY -->
    <section class="muscle-anatomy">

      <h2>MUSCLE ANATOMY</h2>

      <!-- Search -->
      <input
        type="search"
        id="muscleSearch"
        class="muscle-search"
        placeholder="Search for a muscle..."
        aria-label="Search muscles"
      >

      <!-- Muscle Images and Names -->
      <div class="muscle-grid" id="muscleGrid">

        <article class="muscle-card" data-name="chest pectorals">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustration%20showing%20muscles%20of%20the%20torso%20Wellcome%20L0046725.jpg"
            alt="Chest muscle anatomy"
            loading="lazy"
          >
          <h3>Chest</h3>
        </article>

        <article class="muscle-card" data-name="back lats trapezius">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustration%20showing%20muscles%20of%20the%20back%20Wellcome%20L0046737.jpg"
            alt="Back muscle anatomy"
            loading="lazy"
          >
          <h3>Back</h3>
        </article>

        <article class="muscle-card" data-name="shoulders deltoids">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustration%20showing%20muscles%20of%20the%20upper%20torso%20Wellcome%20L0046735.jpg"
            alt="Shoulder muscle anatomy"
            loading="lazy"
          >
          <h3>Shoulders</h3>
        </article>

        <article class="muscle-card" data-name="biceps arms">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustrations%20showing%20muscles%20of%20the%20upper%20arm%20Wellcome%20L0046739.jpg"
            alt="Biceps muscle anatomy"
            loading="lazy"
          >
          <h3>Biceps</h3>
        </article>

        <article class="muscle-card" data-name="triceps arms">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustrations%20showing%20muscles%20of%20the%20upper%20arm%20Wellcome%20L0046739.jpg"
            alt="Triceps muscle anatomy"
            loading="lazy"
          >
          <h3>Triceps</h3>
        </article>

        <article class="muscle-card" data-name="forearms lower arms">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustrations%20showing%20muscles%20of%20the%20lower%20arm%20Wellcome%20L0046740.jpg"
            alt="Forearm muscle anatomy"
            loading="lazy"
          >
          <h3>Forearms</h3>
        </article>

        <article class="muscle-card" data-name="abs abdomen core">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Abdomen%20muscle.png"
            alt="Abdominal muscle anatomy"
            loading="lazy"
          >
          <h3>Abs</h3>
        </article>

        <article class="muscle-card" data-name="quadriceps quads thighs">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustration%20showing%20muscles%20of%20the%20legs%20Wellcome%20L0046751.jpg"
            alt="Quadriceps muscle anatomy"
            loading="lazy"
          >
          <h3>Quadriceps</h3>
        </article>

        <article class="muscle-card" data-name="hamstrings back thighs">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustration%20showing%20leg%20muscles%20at%20the%20back%20Wellcome%20L0046749.jpg"
            alt="Hamstring muscle anatomy"
            loading="lazy"
          >
          <h3>Hamstrings</h3>
        </article>

        <article class="muscle-card" data-name="calves calf gastrocnemius">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustration%20showing%20muscles%20of%20the%20lower%20leg%20Wellcome%20L0046754.jpg"
            alt="Calf muscle anatomy"
            loading="lazy"
          >
          <h3>Calves</h3>
        </article>

        <article class="muscle-card" data-name="glutes gluteus buttocks">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Anatomical%20illustration%20showing%20muscles%20of%20the%20back%20Wellcome%20L0046737.jpg"
            alt="Gluteal muscle anatomy"
            loading="lazy"
          >
          <h3>Glutes</h3>
        </article>

      </div>

      <div class="no-results" id="noResults">
        No muscles found.
      </div>

    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">

    <button class="bottom-nav-item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
      </svg>
      <span>Profile</span>
    </button>

    <button class="bottom-nav-item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 21h18"></path>
        <rect x="5" y="12" width="3" height="9" rx="1"></rect>
        <rect x="11" y="7" width="3" height="14" rx="1"></rect>
        <rect x="17" y="3" width="3" height="18" rx="1"></rect>
      </svg>
      <span>Progress</span>
    </button>

    <a class="bottom-nav-item active" href="workout.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6"></path>
        <path d="M6 7v10"></path>
        <path d="M18 7v10"></path>
        <path d="M21 9v6"></path>
        <path d="M6 12h12"></path>
      </svg>
      <span>Workouts</span>
    </a>

    <a class="bottom-nav-item" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">

        <path d="M5 9v12h14V9"></path>
        <path d="M9 21v-7h6v7"></path>
      </svg>
      <span>Home</span>
    </a>

  </nav>

  <!-- Muscle Search Script -->
  <script>
    const muscleSearch = document.getElementById("muscleSearch");
    const muscleCards = document.querySelectorAll(".muscle-card");
    const noResults = document.getElementById("noResults");

    muscleSearch.addEventListener("input", function () {
      const searchValue = this.value.trim().toLowerCase();
      let visibleCount = 0;

      muscleCards.forEach(function (card) {
        const muscleName = card.dataset.name.toLowerCase();
        const title = card.querySelector("h3").textContent.toLowerCase();

        const matches =
          muscleName.includes(searchValue) ||
          title.includes(searchValue);

        card.style.display = matches ? "" : "none";

        if (matches) {
          visibleCount++;
        }
      });

      noResults.style.display =
        visibleCount === 0 ? "block" : "none";
    });
  </script>

</body>
</html>
