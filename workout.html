    technique:"استند على الساعدين وأطراف القدمين. اجعل الجسم في خط مستقيم، وشد البطن والأرداف مع التنفس الطبيعي.",
    tip:"لا ترفع الحوض أو تترك أسفل الظهر يهبط."
  },
  {
    name:"عجلة البطن", en:"Ab Wheel Rollout",
    category:"البطن", muscle:"عضلات البطن والجذع",
    start:1725,
    technique:"ابدأ من وضع الركوع وأمسك العجلة. حركها للأمام ببطء بقدر قدرتك مع شد البطن، ثم اسحبها للعودة.",
    tip:"لا تسمح لأسفل الظهر بالهبوط أثناء الحركة."

    technique:"استلقِ على ظهرك وارفع الساقين معًا بتحكم، ثم أنزلهما ببطء دون ترك أسفل الظهر يتقوس.",
    tip:"اثنِ الركبتين قليلًا إذا كانت الحركة صعبة."
  }
];

const grid = document.getElementById("exerciseGrid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
let activeCategory = "الكل";

function renderExercises(){
  const term = search.value.trim().toLowerCase();

  const filtered = exercises.filter(ex=>{
    const matchesCategory =
      activeCategory === "الكل" || ex.category === activeCategory;

    const searchable =
      (ex.name+" "+ex.en+" "+ex.category+" "+ex.muscle).toLowerCase();

    return matchesCategory && searchable.includes(term);
  });

  grid.innerHTML = "";

  filtered.forEach(ex=>{
    const index = exercises.indexOf(ex);
    const card = document.createElement("div");
    card.className = "exercise";

    card.innerHTML = `
      <h3>${ex.name}</h3>
      <div class="en">${ex.en}</div>
      <div class="muscle">${ex.category}</div>
      <div class="open-video">▶ شاهد الفيديو والتفاصيل</div>
    `;

    card.addEventListener("click",()=>openExercise(index));
    grid.appendChild(card);
  });

  count.textContent = `عدد التمارين: ${filtered.length}`;
  empty.style.display = filtered.length ? "none" : "block";
}

function openExercise(index){
  const ex = exercises[index];

  document.getElementById("modalTitle").textContent =
    ex.name + " | " + ex.en;

  document.getElementById("modalMuscle").textContent = ex.muscle;
  document.getElementById("modalTechnique").textContent = ex.technique;
  document.getElementById("modalTip").textContent = ex.tip;

  // نفس فيديو الشرح، مع بدء التشغيل عند توقيت التمرين المختار
  document.getElementById("videoFrame").src =
    `https://www.youtube-nocookie.com/embed/ESRffixya9Y?start=${ex.start}&rel=0`;

  document.getElementById("modal").style.display = "block";
  document.body.style.overflow = "hidden";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
  document.getElementById("videoFrame").src = "";
  document.body.style.overflow = "auto";
}

search.addEventListener("input",renderExercises);

document.querySelectorAll(".filter").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    activeCategory = button.dataset.category;
    renderExercises();
  });
});

document.getElementById("modal").addEventListener("click",event=>{
  if(event.target.id === "modal") closeModal();
});

renderExercises();
</script>
