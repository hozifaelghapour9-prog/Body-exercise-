
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمة مرور جديدة | BODY EXERCISE</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(rgba(0,0,0,.78), rgba(0,0,0,.88)),
        url("https://raw.githubusercontent.com/hozifaelghapour9-prog/Body-exercise-/main/body-exersice-gym-exact.jpg")
        center/cover fixed;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      background: rgba(15,15,15,.88);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 15px;
      text-align: center;
    }

    .brand {
      direction: ltr;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .brand span {
      color: #00d5c4;
    }

    .subtitle {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 12px;
    }

    p {
      color: #bbb;
      line-height: 1.7;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 48px;
      margin-top: 16px;
      padding: 0 14px;
      border: 1px solid #444;
      border-radius: 7px;
      outline: none;
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 15px;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #00d5c4;
    }

    button {
      width: 100%;
      height: 47px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #00cdbb;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.6;
    }

    .error {
      color: #ff7777;
    }

    .success {
      color: #00d5c4;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">BODY <span>EXERCISE</span></div>
    <div class="subtitle">Exercise Platform</div>

    <h2>إنشاء كلمة مرور جديدة</h2>

    <p>اكتب كلمة المرور الجديدة وأعد كتابتها للتأكيد.</p>

    <input
      id="password"
      type="password"
      placeholder="كلمة المرور الجديدة"
      autocomplete="new-password"
      disabled
    >

    <input
      id="confirmPassword"
      type="password"
      placeholder="تأكيد كلمة المرور"
      autocomplete="new-password"
      disabled
    >

    <button id="saveBtn" disabled>حفظ كلمة المرور</button>

    <div id="message"></div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://xgxmtizyzjfxxwsmcspe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Jl3bsVErQ87xlzyNkJrRNw_aD_TKsEg";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const saveBtn = document.getElementById("saveBtn");
    const messageBox = document.getElementById("message");

    let sessionIsValid = false;

    function showMessage(message, isError = false) {
      messageBox.textContent = message;
      messageBox.className = isError ? "error" : "success";
    }

    async function checkSession() {
      const verified = sessionStorage.getItem("reset_verified");

      if (verified !== "true") {
        location.replace("forgot-password.html");
        return;
      }

      try {
        const { data, error } = await db.auth.getSession();

        if (error || !data.session) {
          throw new Error("انتهت جلسة التحقق.");
        }

        sessionIsValid = true;

        passwordInput.disabled = false;
        confirmInput.disabled = false;
        saveBtn.disabled = false;

      } catch (error) {
        sessionStorage.removeItem("reset_verified");
        location.replace("forgot-password.html");
      }
    }

    checkSession();

    saveBtn.addEventListener("click", async () => {
      if (!sessionIsValid) {
        showMessage("يجب التحقق من رمز البريد الإلكتروني أولاً.", true);
        return;
      }

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (!password || !confirmPassword) {
        showMessage("اكتب كلمة المرور وأكدها.", true);
        return;
      }

      if (password.length < 6) {
        showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل.", true);
        return;
      }

      if (password !== confirmPassword) {
        showMessage("كلمتا المرور غير متطابقتين.", true);
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "جاري الحفظ...";

      try {
        const { data: sessionData, error: sessionError } =
          await db.auth.getSession();

        if (sessionError || !sessionData.session) {
          throw new Error("انتهت جلسة التحقق. أعد طلب رمز جديد.");
        }

        const { error } = await db.auth.updateUser({
          password: password
        });

        if (error) throw error;

        sessionStorage.removeItem("reset_verified");
        sessionStorage.removeItem("reset_email");
        sessionStorage.removeItem("reset_phone_email");
        sessionStorage.removeItem("reset_method");

        showMessage(
          "تم تغيير كلمة المرور بنجاح. جاري دخول الموقع..."
        );

        setTimeout(() => {
          location.href = "index.html";
        }, 1200);

      } catch (error) {
        showMessage(
          error.message || "حدث خطأ أثناء تغيير كلمة المرور.",
          true
        );

        saveBtn.disabled = false;
        saveBtn.textContent = "حفظ كلمة المرور";
      }
    });
  </script>

</body>
</html>
