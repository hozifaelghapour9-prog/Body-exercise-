
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور | BODY EXERCISE</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(rgba(0,0,0,.78), rgba(0,0,0,.88)),
        url("https://raw.githubusercontent.com/hozifaelghapour9-prog/Body-exercise-/main/body-exersice-gym-exact.jpg")
        center/cover fixed;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      background: rgba(15,15,15,.88);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 15px;
      text-align: center;
    }

    .brand {
      direction: ltr;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .brand span {
      color: #00d5c4;
    }

    .subtitle {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 12px;
    }

    p {
      color: #bbb;
      line-height: 1.7;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 48px;
      margin-top: 20px;
      padding: 0 14px;
      border: 1px solid #444;
      border-radius: 7px;
      outline: none;
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 15px;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #00d5c4;
    }

    button {
      width: 100%;
      height: 47px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #00cdbb;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #00d5c4;
      text-decoration: none;
      font-size: 14px;
    }

    #message {
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.6;
    }

    .error {
      color: #ff7777;
    }

    .success {
      color: #00d5c4;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="brand">BODY <span>EXERCISE</span></div>
    <div class="subtitle">Exercise Platform</div>

    <h2>نسيت كلمة المرور؟</h2>

    <p>
      اكتب البريد الإلكتروني المسجل في حسابك،
      وسنرسل لك كود التحقق لتعيين كلمة مرور جديدة.
    </p>

    <input
      id="account"
      type="text"
      placeholder="البريد الإلكتروني أو اسم المستخدم"
      autocomplete="username"
    >

    <button id="sendBtn">إرسال كود التحقق</button>

    <div id="message"></div>

    <a class="back" href="login.html">العودة إلى تسجيل الدخول</a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://xgxmtizyzjfxxwsmcspe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Jl3bsVErQ87xlzyNkJrRNw_aD_TKsEg";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const accountInput = document.getElementById("account");
    const sendBtn = document.getElementById("sendBtn");
    const messageBox = document.getElementById("message");

    function showMessage(message, isError = false) {
      messageBox.textContent = message;
      messageBox.className = isError ? "error" : "success";
    }

    sendBtn.addEventListener("click", async () => {
      let account = accountInput.value.trim();

      if (!account) {
        showMessage("اكتب البريد الإلكتروني أو اسم المستخدم أولاً.", true);
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "جاري الإرسال...";
      messageBox.textContent = "";

      try {
        let email = account.toLowerCase();

        // لو المستخدم كتب اسم المستخدم، نجيب البريد المرتبط به
        if (!email.includes("@")) {
          const { data, error } = await db.rpc(
            "get_email_by_username",
            { p_username: account }
          );

          if (error) throw error;

          if (!data) {
            throw new Error("اسم المستخدم غير موجود.");
          }

          email = data.trim().toLowerCase();
        }

        // إرسال كود OTP إلى البريد دون إنشاء حساب جديد
        const { error } = await db.auth.signInWithOtp({
          email: email,
          options: {
            shouldCreateUser: false
          }
        });

        if (error) throw error;

        sessionStorage.setItem("reset_email", email);
        sessionStorage.removeItem("reset_verified");

        location.href = "reset-otp.html";

      } catch (error) {
        showMessage(
          error.message || "حدث خطأ أثناء إرسال الكود.",
          true
        );

        sendBtn.disabled = false;
        sendBtn.textContent = "إرسال كود التحقق";
      }
    });

    accountInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendBtn.click();
      }
    });
  </script>
</body>
</html>
