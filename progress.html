
<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">

  <title>BODY RESET | PROGRESS</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    body {
      margin: 0;
      background: #0b0e13;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .progress-main {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 20px 15px 110px;
      box-sizing: border-box;
    }

    .progress-header {
      margin-bottom: 25px;
    }

    .progress-header h1 {
      margin: 0 0 8px;
      color: #b7e0d2;
      font-size: 30px;
      font-weight: 900;
    }

    .progress-header p {
      margin: 0;
      color: #aaa;
      line-height: 1.6;
    }

    .progress-card {
      margin-bottom: 18px;
      padding: 20px;
      background: #151c25;
      border: 1px solid #30363e;
      border-radius: 18px;
      box-sizing: border-box;
    }

    .progress-card h2 {
      margin: 0 0 18px;
      color: #b7e0d2;
      font-size: 21px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-box {
      padding: 16px 12px;
      background: #0b0e13;
      border: 1px solid #30363e;
      border-radius: 13px;
    }

    .stat-box span {
      display: block;
      margin-bottom: 9px;
      color: #aaa;
      font-size: 13px;
    }

    .stat-box strong {
      color: #b7e0d2;
      font-size: 25px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .progress-form {
      display: grid;
      gap: 14px;
    }

    .progress-form label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 14px;
      font-weight: bold;
    }

    .progress-form input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      box-sizing: border-box;
      background: #0b0e13;
      border: 1px solid #30363e;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .progress-form input:focus {
      border-color: #b7e0d2;
    }

    .progress-btn {
      width: 100%;
      min-height: 50px;
      padding: 12px;
      background: #b7e0d2;
      border: none;
      border-radius: 11px;
      color: #0b0e13;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .progress-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 260px;
    }

    #weightChart {
      width: 100%;
      height: 100%;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px;
      background: #0b0e13;
      border: 1px solid #30363e;
      border-radius: 11px;
    }

    .history-item strong {
      color: #b7e0d2;
      font-size: 17px;
    }

    .history-item span {
      color: #aaa;
      font-size: 13px;
    }

    .progress-message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 14px;
    }

    .progress-message.success {
      display: block;
      background: rgba(100, 200, 140, .12);
      color: #9be0b4;
    }

    .progress-message.error {
      display: block;
      background: rgba(255, 80, 80, .12);
      color: #ff9999;
    }

    .empty-message {
      color: #aaa;
      text-align: center;
      line-height: 1.7;
      padding: 15px 0;
    }

    @media (max-width: 480px) {
      .progress-header h1 {
        font-size: 26px;
      }

      .progress-card {
        padding: 16px;
      }

      .stat-box strong {
        font-size: 22px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <main class="progress-main">

    <header class="progress-header">
      <h1>MY PROGRESS</h1>
      <p>Track your journey. Every small step matters.</p>
    </header>

    <section class="progress-card">
      <h2>YOUR STATISTICS</h2>

      <div class="stats-grid">

        <div class="stat-box">
          <span>Current Weight</span>
          <strong id="currentWeight">--</strong>
        </div>

        <div class="stat-box">
          <span>Weight Change</span>
          <strong id="weightChange">--</strong>
        </div>

        <div class="stat-box">
          <span>Height</span>
          <strong id="userHeight">--</strong>
        </div>

        <div class="stat-box">
          <span>Your Goal</span>
          <strong id="userGoal" style="font-size:17px">--</strong>
        </div>

      </div>
    </section>

    <section class="progress-card">

      <h2>UPDATE YOUR WEIGHT</h2>

      <form id="weightForm" class="progress-form">

        <div>
          <label for="weightInput">Your Weight (kg)</label>

          <input
            type="number"
            id="weightInput"
            min="1"
            max="500"
            step="0.1"
            placeholder="Enter your current weight"
            required
          >
        </div>

        <button class="progress-btn" id="saveWeightBtn" type="submit">
          SAVE WEIGHT
        </button>

      </form>

      <div id="progressMessage" class="progress-message"></div>

    </section>

    <section class="progress-card">

      <h2>WEIGHT PROGRESS</h2>

      <div class="chart-container">
        <canvas id="weightChart"></canvas>
      </div>

      <p id="chartEmpty" class="empty-message">
        Your weight chart will appear after your first entry.
      </p>

    </section>

    <section class="progress-card">

      <h2>WEIGHT HISTORY</h2>

      <div id="weightHistory" class="history-list">
        <p class="empty-message">Loading your history...</p>
      </div>

    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">

    <a class="bottom-nav-item active"
       href="./progress.html"
       aria-label="Progress">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3v18h18"></path>
        <path d="m7 14 4-4 4 4 6-7"></path>
      </svg>
      <span>Progress</span>
    </a>

    <a class="bottom-nav-item"
       href="./profile.html"
       aria-label="Profile">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
      </svg>
      <span>Profile</span>
    </a>

    <a class="bottom-nav-item"
       href="./workout.html"
       aria-label="Workouts">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6"></path>
        <path d="M6 7v10"></path>
        <path d="M18 7v10"></path>
        <path d="M21 9v6"></path>
        <path d="M6 12h12"></path>
      </svg>
      <span>Workouts</span>
    </a>

    <a class="bottom-nav-item"
       href="./index.html"
       aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 10 9-7 9 7"></path>
        <path d="M5 9v12h14V9"></path>
        <path d="M9 21v-7h6v7"></path>
      </svg>
      <span>Home</span>
    </a>

  </nav>

  <script>
    const SUPABASE_URL =
      "https://xgxmtizyzjfxxwsmcspe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Jl3bsVErQ87xlzyNkJrRNw_aD_TKsEg";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let currentUser = null;
    let weightChart = null;

    const weightForm = document.getElementById("weightForm");
    const weightInput = document.getElementById("weightInput");
    const saveWeightBtn = document.getElementById("saveWeightBtn");
    const progressMessage = document.getElementById("progressMessage");

    function showMessage(message, type) {
      progressMessage.textContent = message;
      progressMessage.className = "progress-message " + type;
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    async function checkSession() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {
        window.location.href = "./login.html";
        return null;
      }

      return data.session.user;
    }

    async function loadProfile() {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("weight, height, goal")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (error) {
        console.error("Profile error:", error);
        return;
      }

      if (!data) return;

      document.getElementById("userHeight").textContent =
        data.height ? data.height + " cm" : "--";

      document.getElementById("userGoal").textContent =
        data.goal || "--";

      if (data.weight) {
        weightInput.value = data.weight;
      }
    }

    async function loadWeightHistory() {
      const { data, error } = await supabaseClient
        .from("weight_logs")
        .select("id, weight, recorded_at")
        .eq("user_id", currentUser.id)
        .order("recorded_at", { ascending: true });

      if (error) {
        console.error("Weight history error:", error);

        document.getElementById("weightHistory").textContent =
          "Could not load weight history. Check your database setup.";

        return;
      }

      renderWeightData(data || []);
    }

    function renderWeightData(records) {
      const currentWeightElement =
        document.getElementById("currentWeight");

      const weightChangeElement =
        document.getElementById("weightChange");

      const historyElement =
        document.getElementById("weightHistory");

      const chartEmpty =
        document.getElementById("chartEmpty");

      if (!records.length) {
        currentWeightElement.textContent = "--";
        weightChangeElement.textContent = "--";

        historyElement.innerHTML =
          '<p class="empty-message">No weight records yet. Add your first weight above.</p>';

        chartEmpty.style.display = "block";

        if (weightChart) {
          weightChart.destroy();
          weightChart = null;
        }

        return;
      }

      const firstRecord = records[0];
      const latestRecord = records[records.length - 1];

      const difference =
        Number(latestRecord.weight) - Number(firstRecord.weight);

      currentWeightElement.textContent =
        Number(latestRecord.weight).toFixed(1) + " kg";

      if (records.length > 1) {
        const sign = difference > 0 ? "+" : "";

        weightChangeElement.textContent =
          sign + difference.toFixed(1) + " kg";
      } else {
        weightChangeElement.textContent = "First entry";
      }

      historyElement.innerHTML = "";

      [...records].reverse().forEach(record => {
        const item = document.createElement("div");
        item.className = "history-item";

        const date = document.createElement("span");
        date.textContent = formatDate(record.recorded_at);

        const weight = document.createElement("strong");
        weight.textContent =
          Number(record.weight).toFixed(1) + " kg";

        item.appendChild(date);
        item.appendChild(weight);

        historyElement.appendChild(item);
      });

      chartEmpty.style.display = "none";

      renderChart(records);
    }

    function renderChart(records) {
      const ctx = document
        .getElementById("weightChart")
        .getContext("2d");

      if (weightChart) {
        weightChart.destroy();
      }

      weightChart = new Chart(ctx, {
        type: "line",

        data: {
          labels: records.map(record =>
            formatDate(record.recorded_at)
          ),

          datasets: [{
            label: "Weight (kg)",

            data: records.map(record =>
              Number(record.weight)
            ),

            borderColor: "#b7e0d2",
            backgroundColor: "rgba(183, 224, 210, 0.12)",
            borderWidth: 3,
            pointRadius: 4,
            pointBackgroundColor: "#b7e0d2",
            fill: true,
            tension: 0.3
          }]
        },

        options: {
          responsive: true,
          maintainAspectRatio: false,

          plugins: {
            legend: {
              labels: {
                color: "#ffffff"
              }
            }
          },

          scales: {
            x: {
              ticks: {
                color: "#aaa"
              },
              grid: {
                color: "rgba(255,255,255,0.06)"
              }
            },

            y: {
              ticks: {
                color: "#aaa"
              },
              grid: {
                color: "rgba(255,255,255,0.06)"
              }
            }
          }
        }
      });
    }

    weightForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const weight = Number(weightInput.value);

      if (!Number.isFinite(weight) || weight <= 0 || weight > 500) {
        showMessage("Please enter a valid weight.", "error");
        return;
      }

      saveWeightBtn.disabled = true;
      saveWeightBtn.textContent = "SAVING...";

      try {
        const { error } = await supabaseClient
          .from("weight_logs")
          .insert({
            user_id: currentUser.id,
            weight: weight
          });

        if (error) throw error;

        showMessage(
          "Your weight has been saved successfully.",
          "success"
        );

        await loadWeightHistory();

        const { error: profileError } = await supabaseClient
          .from("profiles")
          .update({ weight: weight })
          .eq("user_id", currentUser.id);

        if (profileError) {
          console.error("Profile update error:", profileError);
        }

      } catch (error) {
        console.error("Save weight error:", error);

        showMessage(
          "Could not save weight. Check the database table and permissions.",
          "error"
        );
      } finally {
        saveWeightBtn.disabled = false;
        saveWeightBtn.textContent = "SAVE WEIGHT";
      }
    });

    async function initProgressPage() {
      currentUser = await checkSession();

      if (!currentUser) return;

      await loadProfile();
      await loadWeightHistory();
    }

    initProgressPage();
  </script>

</body>
</html>
